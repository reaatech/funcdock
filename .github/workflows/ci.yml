name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════
  # Stage 1 — Build + Code Quality (parallel)
  # ═══════════════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (dashboard)
        working-directory: ./dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: ./dashboard
        run: npm run build

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm run audit
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npm run format:check

  # ═══════════════════════════════════════════════════════════
  # Stage 2 — Tests + Docker (depends on Stage 1)
  # ═══════════════════════════════════════════════════════════
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build, audit, lint, format]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (dashboard)
        working-directory: ./dashboard
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-min-16-chars
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: admin123

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, audit, lint, format]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: funcdock:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker image
        run: |
          docker run -d --name funcdock-ci -p 3000:3000 \
            -e JWT_SECRET=ci-jwt-secret-min-16-chars \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=admin123 \
            -e DEPLOY_API_KEY=ci-deploy-key \
            funcdock:latest
          sleep 5
          curl -sf http://localhost:3000/api/status -H "x-deploy-api-key: ci-deploy-key" || exit 1
          docker stop funcdock-ci
          docker rm funcdock-ci
