name: Deploy Serverless Function

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Name of the function to deploy'
        required: true
        type: string
      git_url:
        description: 'Git repository URL'
        required: true
        type: string
      branch:
        description: 'Git branch to deploy'
        required: false
        default: 'main'
        type: string
      server_host:
        description: 'Target server hostname'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy Function
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ inputs.server_host }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GIT_URL,BRANCH,FUNCTION_NAME
          script: |
            cd /app
            node scripts/deploy.js --git "$GIT_URL" --name "$FUNCTION_NAME" --branch "$BRANCH"
            sleep 2
            curl -f http://localhost:3000/api/status || exit 1
            echo "✅ Function $FUNCTION_NAME deployed successfully"
        env:
          GIT_URL: ${{ inputs.git_url }}
          BRANCH: ${{ inputs.branch }}
          FUNCTION_NAME: ${{ inputs.function_name }}

      - name: Notify deployment status
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: |
            Function Deployment ${{ job.status }}
            • Function: ${{ inputs.function_name }}
            • Repository: ${{ inputs.git_url }}
            • Branch: ${{ inputs.branch }}
            • Server: ${{ inputs.server_host }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
