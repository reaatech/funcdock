  /api/layers/deploy/local:
    post:
      tags:
        - Layers
      summary: Deploy layer from local files
      description: Deploy a new layer by uploading files
      operationId: deployLayerLocal
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - files
              properties:
                name:
                  type: string
                  description: Layer name
                  example: 'common-utils'
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Layer files to upload
            encoding:
              files:
                contentType: application/octet-stream
      responses:
        '200':
          description: Layer deployed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployResponse'
              example:
                message: 'Layer deployed successfully'
                layer:
                  name: 'common-utils'
                  status: 'loaded'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Layer name and files are required'
        '409':
          description: Layer already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Layer 'common-utils' already exists. Use PUT /api/layers/common-utils to update it."
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Internal server error'

