openapi: 3.0.3
info:
  title: FuncDock API
  description: |
    The Ultimate Node.js FaaS Platform API

    FuncDock is a revolutionary serverless platform with instant hot reload, CI/CD deployments, 
    per-route handlers, real-time dashboards, and production-grade testing.

    ## Features
    - ⚡ Instant hot reload - Deploy code and see it live in milliseconds
    - 🎯 Per-route handlers - Each route can have its own handler file
    - 🎛️ Live real-time dashboard - Streaming logs, live metrics, route health monitoring
    - 🏠 All functions in one container - Massive cost reduction
    - 🧪 Production-grade testing - Jest + Nock testing in Docker environments
    - ⏰ Smart cron jobs - Per-function scheduling with timezone support
    - 🔒 Enterprise ready - Route conflict prevention, security headers
  version: 1.0.0
  contact:
    name: FuncDock Support
    url: https://github.com/your-org/funcdock
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3003
    description: Local development server
  - url: https://api.funcdock.example.com
    description: Production server (example)

tags:
  - name: Authentication
    description: User authentication and authorization endpoints
  - name: System
    description: System status, health checks, and management
  - name: Functions
    description: Function management, deployment, and monitoring
  - name: Layers
    description: Layer management and deployment
  - name: Files
    description: File management for functions and layers
  - name: Cron Jobs
    description: Scheduled task management
  - name: OAuth
    description: OAuth integration with GitHub and Bitbucket
  - name: Logs & Metrics
    description: System and function logging and metrics

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/auth/login endpoint

  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Error message
          example: 'Function not found'
        error:
          type: string
          description: Detailed error information
          example: 'ENOENT: no such file or directory'
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the error occurred
          example: '2024-01-15T10:30:00.000Z'

    User:
      type: object
      properties:
        username:
          type: string
          example: 'admin'
        role:
          type: string
          example: 'admin'

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Admin username
          example: 'admin'
        password:
          type: string
          format: password
          description: Admin password
          example: 'admin'

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT authentication token
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6ImFkbWluIiwicm9sZSI6ImFkbWluIiwiaWF0IjoxNjA5ODc2NDAwLCJleHAiOjE2MDk5NjI4MDB9.example'
        user:
          $ref: '#/components/schemas/User'

    Route:
      type: object
      properties:
        method:
          type: string
          enum: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
          example: 'GET'
        path:
          type: string
          description: Full route path including base
          example: '/hello-world/greet'
        handler:
          type: string
          description: Handler file name
          example: 'greet.js'

    CronJob:
      type: object
      required:
        - name
        - schedule
        - handler
      properties:
        name:
          type: string
          description: Unique name for the cron job
          example: 'daily-greeting'
        schedule:
          type: string
          description: Cron schedule expression
          example: '0 9 * * *'
          pattern: '^[0-9*,\\-/\\s]+$'
        handler:
          type: string
          description: Handler file path relative to function directory
          example: 'cron-handler.js'
        timezone:
          type: string
          description: Timezone for the cron job
          default: 'UTC'
          example: 'UTC'
        description:
          type: string
          description: Human-readable description of the cron job
          example: 'Sends a daily greeting every day at 9:00 AM UTC'

    CronJobsConfig:
      type: object
      required:
        - jobs
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/CronJob'

    Function:
      type: object
      properties:
        name:
          type: string
          description: Function name
          example: 'hello-world'
        status:
          type: string
          enum: [running, error, stopped]
          description: Function status
          example: 'running'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        cronJobs:
          type: integer
          description: Number of active cron jobs
          example: 2
        lastDeployed:
          type: string
          format: date-time
          description: Last deployment timestamp
          example: '2024-01-15T10:30:00.000Z'
        path:
          type: string
          description: File system path to function directory
          example: '/app/functions/hello-world'
        baseUrl:
          type: string
          description: Base URL prefix for function routes
          example: '/hello-world'
        layerName:
          type: string
          nullable: true
          description: Associated layer name
          example: 'common-utils'
        layerError:
          type: string
          nullable: true
          description: Error message if layer association failed
          example: null

    FunctionList:
      type: object
      properties:
        functions:
          type: array
          items:
            $ref: '#/components/schemas/Function'

    FunctionDetail:
      allOf:
        - $ref: '#/components/schemas/Function'
        - type: object
          properties:
            cronJobs:
              type: array
              items:
                $ref: '#/components/schemas/CronJob'
              description: Detailed cron job configurations

    Layer:
      type: object
      properties:
        name:
          type: string
          description: Layer name
          example: 'common-utils'
        version:
          type: string
          description: Layer version
          example: '1.0.0'
        description:
          type: string
          description: Layer description
          example: 'Common utility functions and dependencies'
        status:
          type: string
          enum: [loaded, error]
          description: Layer status
          example: 'loaded'
        loadedAt:
          type: string
          format: date-time
          description: When the layer was loaded
          example: '2024-01-15T10:30:00.000Z'
        functionsUsing:
          type: array
          items:
            type: string
          description: List of function names using this layer
          example: ['hello-world', 'webhook-handler']

    LayerDetail:
      allOf:
        - $ref: '#/components/schemas/Layer'
        - type: object
          properties:
            path:
              type: string
              description: File system path to layer directory
              example: '/app/layers/common-utils'
            nodejsPath:
              type: string
              description: Path to nodejs directory within layer
              example: '/app/layers/common-utils/nodejs'
            config:
              type: object
              description: Layer configuration from layer.json
              additionalProperties: true

    LayerList:
      type: object
      properties:
        layers:
          type: array
          items:
            $ref: '#/components/schemas/Layer'

    FileNode:
      type: object
      properties:
        name:
          type: string
          description: File or directory name
          example: 'handler.js'
        path:
          type: string
          description: Relative path from function/layer root
          example: 'handler.js'
        type:
          type: string
          enum: [file, directory]
          description: Node type
          example: 'file'
        size:
          type: integer
          description: File size in bytes (only for files)
          example: 1024
        children:
          type: array
          items:
            $ref: '#/components/schemas/FileNode'
          description: Child nodes (only for directories)

    FileTree:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileNode'

    FileContent:
      type: object
      properties:
        content:
          type: string
          description: File content as string
          example: "export default async function handler(req, res) {\n  res.json({ message: 'Hello World' });\n}"

    LogEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Log entry timestamp
          example: '2024-01-15T10:30:00.000Z'
        message:
          type: string
          description: Log message
          example: 'Function handler called'
        level:
          type: string
          enum: [INFO, ERROR, WARN, ACCESS, CRON, CRON_ERROR]
          description: Log level
          example: 'INFO'
        function:
          type: string
          nullable: true
          description: Function name (if function-specific log)
          example: 'hello-world'
        method:
          type: string
          description: HTTP method (for ACCESS logs)
          example: 'GET'
        path:
          type: string
          description: Request path (for ACCESS logs)
          example: '/hello-world/greet'
        statusCode:
          type: integer
          description: HTTP status code (for ACCESS logs)
          example: 200
        duration:
          type: integer
          description: Request duration in milliseconds (for ACCESS logs)
          example: 45
        ip:
          type: string
          description: Client IP address (for ACCESS logs)
          example: '192.168.1.1'
        userAgent:
          type: string
          description: User agent string (for ACCESS logs)
          example: 'Mozilla/5.0...'

    LogResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'

    FunctionMetrics:
      type: object
      properties:
        name:
          type: string
          example: 'hello-world'
        invocations:
          type: integer
          description: Total number of function invocations
          example: 1250
        errors:
          type: integer
          description: Total number of errors
          example: 5
        avgResponseTime:
          type: number
          description: Average response time in milliseconds
          example: 45.2
        lastInvocation:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of last invocation
          example: '2024-01-15T10:30:00.000Z'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        cronJobs:
          type: integer
          description: Number of active cron jobs
          example: 2

    SystemMetrics:
      type: object
      properties:
        uptime:
          type: number
          description: System uptime in seconds
          example: 86400.5
        memory:
          type: object
          properties:
            rss:
              type: integer
              description: Resident set size in bytes
              example: 52428800
            heapTotal:
              type: integer
              description: Total heap size in bytes
              example: 41943040
            heapUsed:
              type: integer
              description: Used heap size in bytes
              example: 31457280
            external:
              type: integer
              description: External memory in bytes
              example: 1048576
        functions:
          type: integer
          description: Number of loaded functions
          example: 5
        activeRoutes:
          type: integer
          description: Number of registered routes
          example: 12
        activeCronJobs:
          type: integer
          description: Number of active cron jobs
          example: 8
        timestamp:
          type: string
          format: date-time
          description: Metrics timestamp
          example: '2024-01-15T10:30:00.000Z'

    SystemStatus:
      type: object
      properties:
        status:
          type: string
          enum: [running, stopped]
          example: 'running'
        uptime:
          type: number
          description: System uptime in seconds
          example: 86400.5
        functionsLoaded:
          type: integer
          description: Number of loaded functions
          example: 5
        routesRegistered:
          type: integer
          description: Number of registered routes
          example: 12
        cronJobsActive:
          type: integer
          description: Number of active cron jobs
          example: 8
        totalFunctions:
          type: integer
          description: Total number of functions
          example: 5
        totalRoutes:
          type: integer
          description: Total number of routes
          example: 12
        totalCronJobs:
          type: integer
          description: Total number of cron jobs
          example: 8
        functions:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              routes:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
              loadedAt:
                type: string
                format: date-time
              routeCount:
                type: integer
              cronJobs:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    schedule:
                      type: string
                    handler:
                      type: string
                    timezone:
                      type: string
        timestamp:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'

    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          example: 'healthy'
        timestamp:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
        functions:
          type: integer
          description: Number of loaded functions
          example: 5

    ReloadRequest:
      type: object
      properties:
        functionName:
          type: string
          description: Specific function name to reload (optional, reloads all if omitted)
          example: 'hello-world'

    ReloadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Function hello-world reloaded successfully'
        functionsLoaded:
          type: integer
          description: Number of functions loaded (only for full reload)
          example: 5
        timestamp:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'

    DeployLocalRequest:
      type: object
      required:
        - name
        - files
      properties:
        name:
          type: string
          description: Function or layer name
          example: 'hello-world'
        files:
          type: array
          items:
            type: string
            format: binary
          description: Files to upload (multipart/form-data)

    DeployGitRequest:
      type: object
      required:
        - name
        - repo
      properties:
        name:
          type: string
          description: Function or layer name
          example: 'hello-world'
        repo:
          type: string
          format: uri
          description: Git repository URL
          example: 'https://github.com/user/repo.git'
        branch:
          type: string
          description: Git branch name
          default: 'main'
          example: 'main'
        commit:
          type: string
          description: Specific commit hash (optional)
          example: 'abc123def456'

    DeployResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Function deployed successfully'
        function:
          type: object
          properties:
            name:
              type: string
              example: 'hello-world'
            status:
              type: string
              example: 'running'
        layer:
          type: object
          properties:
            name:
              type: string
              example: 'common-utils'
            status:
              type: string
              example: 'loaded'

    TestFunctionRequest:
      type: object
      properties:
        method:
          type: string
          enum: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
          default: 'GET'
          example: 'GET'
        path:
          type: string
          default: '/'
          description: Route path to test
          example: '/greet'
        data:
          type: object
          description: Request body data
          additionalProperties: true
          example:
            name: 'World'
        headers:
          type: object
          description: Additional request headers
          additionalProperties:
            type: string
          example:
            'Content-Type': 'application/json'

    TestFunctionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        response:
          type: object
          description: Function response body
          additionalProperties: true
          example:
            message: 'Hello, World!'
        headers:
          type: object
          description: Response headers
          additionalProperties:
            type: string
        error:
          type: string
          description: Error message if test failed
          example: null

    EnvResponse:
      type: object
      properties:
        env:
          type: object
          description: Environment variables as key-value pairs
          additionalProperties:
            type: string
          example:
            API_KEY: 'secret-key-123'
            DATABASE_URL: 'postgresql://localhost:5432/mydb'

    LayerAssociationRequest:
      type: object
      required:
        - layer
      properties:
        layer:
          type: string
          description: Layer name to associate
          example: 'common-utils'

    LayerAssociationResponse:
      type: object
      properties:
        message:
          type: string
          example: "Layer 'common-utils' associated with function"
        layer:
          type: string
          nullable: true
          example: 'common-utils'

    OAuthUrlResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: OAuth authorization URL
          example: 'https://github.com/login/oauth/authorize?client_id=xxx&redirect_uri=xxx&scope=repo&state=xxx'

    Repository:
      type: object
      properties:
        id:
          type: integer
          example: 123456
        name:
          type: string
          example: 'my-function'
        full_name:
          type: string
          example: 'user/my-function'
        description:
          type: string
          nullable: true
          example: 'My awesome function'
        private:
          type: boolean
          example: false
        html_url:
          type: string
          format: uri
          example: 'https://github.com/user/my-function'
        clone_url:
          type: string
          format: uri
          example: 'https://github.com/user/my-function.git'
        default_branch:
          type: string
          example: 'main'

    RepositoryList:
      type: array
      items:
        $ref: '#/components/schemas/Repository'

    UpdateLayerFileRequest:
      type: object
      required:
        - path
        - content
      properties:
        path:
          type: string
          description: File path relative to layer nodejs directory
          example: 'utils/helper.js'
        content:
          type: string
          description: File content
          example: "export function helper() { return 'help'; }"

    FunctionLogFiles:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
            example: 'hello-world'
          path:
            type: string
            example: '/app/logs/functions/hello-world.log'

paths:
  /health:
    get:
      tags:
        - System
      summary: Health check endpoint
      description: Public health check endpoint that returns system health status
      security: []
      operationId: healthCheck
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
              example:
                status: 'healthy'
                timestamp: '2024-01-15T10:30:00.000Z'
                functions: 5

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and receive JWT token
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: 'admin'
              password: 'admin'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6ImFkbWluIiwicm9sZSI6ImFkbWluIiwiaWF0IjoxNjA5ODc2NDAwLCJleHAiOjE2MDk5NjI4MDB9.example'
                user:
                  username: 'admin'
                  role: 'admin'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Username is required'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid credentials'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Internal server error'

  /api/auth/verify:
    get:
      tags:
        - Authentication
      summary: Verify JWT token
      description: Verify that the current JWT token is valid
      operationId: verifyToken
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
              example:
                user:
                  username: 'admin'
                  role: 'admin'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Access token required'
        '403':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid or expired token'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Logout user (token blacklisting not implemented in demo)
      operationId: logout
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: 'Logged out successfully'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Access token required'

  /api/status:
    get:
      tags:
        - System
      summary: Get system status
      description: |
        Get comprehensive system status including loaded functions, routes, and cron jobs.
        Available in both public (no auth) and authenticated versions.
      security: []
      operationId: getSystemStatus
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
              example:
                status: 'running'
                uptime: 86400.5
                functionsLoaded: 5
                routesRegistered: 12
                cronJobsActive: 8
                totalFunctions: 5
                totalRoutes: 12
                totalCronJobs: 8
                functions:
                  - name: 'hello-world'
                    routes:
                      - method: 'GET'
                        path: '/hello-world/'
                        handler: 'handler.js'
                    loadedAt: '2024-01-15T10:00:00.000Z'
                    routeCount: 7
                    cronJobs:
                      - name: 'daily-greeting'
                        schedule: '0 9 * * *'
                        handler: 'cron-handler.js'
                        timezone: 'UTC'
                timestamp: '2024-01-15T10:30:00.000Z'

  /api/reload:
    post:
      tags:
        - System
      summary: Reload functions
      description: Reload a specific function or all functions
      security: []
      operationId: reloadFunctions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReloadRequest'
            example:
              functionName: 'hello-world'
      responses:
        '200':
          description: Reload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadResponse'
              example:
                success: true
                message: 'Function hello-world reloaded successfully'
                timestamp: '2024-01-15T10:30:00.000Z'
        '500':
          description: Reload failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Failed to reload function hello-world'

  /api/functions:
    get:
      tags:
        - Functions
      summary: List all functions
      description: Get a list of all loaded functions with their status and metadata
      operationId: listFunctions
      responses:
        '200':
          description: List of functions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionList'
              example:
                functions:
                  - name: 'hello-world'
                    status: 'running'
                    routes:
                      - method: 'GET'
                        path: '/hello-world/'
                        handler: 'handler.js'
                      - method: 'GET'
                        path: '/hello-world/greet'
                        handler: 'greet.js'
                    cronJobs: 2
                    lastDeployed: '2024-01-15T10:00:00.000Z'
                    layerName: 'common-utils'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Access token required'

  /api/functions/{name}:
    get:
      tags:
        - Functions
      summary: Get function details
      description: Get detailed information about a specific function
      operationId: getFunction
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Function name
          example: 'hello-world'
      responses:
        '200':
          description: Function details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionDetail'
