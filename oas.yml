              example:
                url: 'https://github.com/login/oauth/authorize?client_id=xxx&redirect_uri=http%3A%2F%2Flocalhost%3A3003%2Fapi%2Foauth%2Fgithub%2Fcallback&scope=repo&state=abc123'
